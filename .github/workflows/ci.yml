name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Reads the Go version straight from go.mod so it can't drift out of sync
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

      # Checks go.sum's dependencies (and the stdlib version in use) against
      # the public Go vulnerability database — catches a known-CVE dependency
      # landing in go.sum that build/vet/test wouldn't flag on their own.
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run lint

      # --audit-level=high: don't fail CI on every low/moderate advisory in a
      # transitive dev-only dependency (noisy, not actionable most of the
      # time) — but a high/critical one in what actually ships is worth
      # blocking on.
      - run: npm audit --audit-level=high
